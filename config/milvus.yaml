# ========================================
# Milvus 2.5 配置文件
# ========================================

# ========================================
# Etcd 配置
# ========================================
etcd:
  endpoints:
    - etcd:2379
  rootPath: by-dev

# ========================================
# MinIO 配置
# ========================================
minio:
  address: minio
  port: 9000
  accessKeyID: minioadmin
  secretAccessKey: minioadmin
  useSSL: false
  bucketName: milvus-bucket
  rootPath: file

# ========================================
# 日志配置
# ========================================
log:
  level: info
  format: text

# ========================================
# 端口配置（避免冲突）
# ========================================
dataCoord:
  port: 13333

queryCoord:
  port: 19531

indexCoord:
  port: 31000

proxy:
  port: 19530
