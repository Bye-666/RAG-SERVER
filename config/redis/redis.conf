# ========================================
# Redis 7.2 配置文件
# ========================================

# ========================================
# 网络配置
# ========================================
# 绑定地址（0.0.0.0 允许所有IP访问）
bind 0.0.0.0

# 端口
port 6379

# 超时时间（秒，0表示不超时）
timeout 300

# TCP keepalive
tcp-keepalive 60

# ========================================
# 持久化配置
# ========================================
# RDB 快照策略
save 900 1
save 300 10
save 60 10000

# RDB 文件名
dbfilename dump.rdb

# 工作目录
dir /data

# AOF 持久化（更安全）
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# ========================================
# 内存管理
# ========================================
# 最大内存（建议根据实际情况调整）
maxmemory 512mb

# 内存淘汰策略（LRU：最近最少使用）
maxmemory-policy allkeys-lru

# 内存样本数（LRU算法精度）
maxmemory-samples 5

# ========================================
# 性能优化
# ========================================
# 最大客户端连接数
maxclients 10000

# 数据库数量
databases 16

# 禁用危险命令（生产环境建议启用）
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""

# ========================================
# 慢日志
# ========================================
# 慢查询阈值（微秒，10000 = 10ms）
slowlog-log-slower-than 10000

# 慢查询日志长度
slowlog-max-len 128

# ========================================
# 安全配置
# ========================================
# 密码保护（生产环境强烈建议设置）
# requirepass your_secure_password

# ========================================
# 其他配置
# ========================================
# 日志级别（debug, verbose, notice, warning）
loglevel notice

# 日志文件（空表示标准输出）
logfile ""
